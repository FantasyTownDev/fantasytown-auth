name: Code Quality

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  check:
    name: Build & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: |
          dotnet restore
          dotnet restore Tests/FantasyTown.Auth.UnitTests
          dotnet restore Tests/FantasyTown.Auth.ContractTests
          dotnet restore Tests/FantasyTown.Auth.IntegrationTests

      - name: Build
        run: dotnet build --no-restore

      - name: Format Check
        run: |
          dotnet format --verify-no-changes --no-restore
          dotnet format Tests/FantasyTown.Auth.UnitTests/FantasyTown.Auth.UnitTests.csproj --verify-no-changes --no-restore
          dotnet format Tests/FantasyTown.Auth.ContractTests/FantasyTown.Auth.ContractTests.csproj --verify-no-changes --no-restore
          dotnet format Tests/FantasyTown.Auth.IntegrationTests/FantasyTown.Auth.IntegrationTests.csproj --verify-no-changes --no-restore
