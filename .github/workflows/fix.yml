name: Fix Pipeline

on:
  push:
    branches:
      - 'fix/**'

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Format Check
        run: dotnet format --verify-no-changes --no-restore
        continue-on-error: true

  test:
    name: Unit Tests
    needs: code-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test Tests/FantasyTown.Auth.UnitTests --no-build --verbosity normal --logger "trx;LogFileName=results.trx"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: Tests/FantasyTown.Auth.UnitTests/TestResults/*.trx
          retention-days: 7

  build:
    name: Build ${{ matrix.rid }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid:
          - win-x64
          - win-x86
          - win-arm64
          - linux-x64
          - linux-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Publish Debug
        run: dotnet publish -c Debug -r ${{ matrix.rid }} --self-contained false --no-restore -o publish/${{ matrix.rid }}-debug/

      - name: Publish Release
        run: dotnet publish -c Release -r ${{ matrix.rid }} --self-contained false --no-restore -o publish/${{ matrix.rid }}-release/

      - name: Upload Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fix-${{ matrix.rid }}-debug
          path: publish/${{ matrix.rid }}-debug/
          retention-days: 7

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fix-${{ matrix.rid }}-release
          path: publish/${{ matrix.rid }}-release/
          retention-days: 7
