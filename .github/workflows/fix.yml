name: Fix Pipeline

on:
  push:
    branches:
      - 'fix/**'

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore
        working-directory: src/FantasyTown.Auth

      - name: Build
        run: dotnet build --no-restore
        working-directory: src/FantasyTown.Auth

      - name: Format Check
        run: dotnet format --verify-no-changes --no-restore
        working-directory: src/FantasyTown.Auth
        continue-on-error: true

  test:
    name: Unit Tests
    needs: code-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore
        working-directory: src/FantasyTown.Auth

      - name: Build
        run: dotnet build --no-restore
        working-directory: src/FantasyTown.Auth

      - name: Test
        run: dotnet test --no-build --verbosity normal --logger "trx;LogFileName=results.trx"
        working-directory: tests/FantasyTown.Auth.UnitTests

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/FantasyTown.Auth.UnitTests/TestResults/*.trx
          retention-days: 7

  build-debug:
    name: Build (Debug)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore
        working-directory: src/FantasyTown.Auth

      - name: Publish Debug
        run: dotnet publish -c Debug --no-restore -o publish-debug/
        working-directory: src/FantasyTown.Auth

      - name: Upload Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fix-debug-build
          path: src/FantasyTown.Auth/publish-debug/
          retention-days: 7

  build-release:
    name: Build (Release)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore
        working-directory: src/FantasyTown.Auth

      - name: Publish Release
        run: dotnet publish -c Release --no-restore -o publish-release/
        working-directory: src/FantasyTown.Auth

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fix-release-build
          path: src/FantasyTown.Auth/publish-release/
          retention-days: 7
