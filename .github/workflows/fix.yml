name: Fix

on:
  push:
    branches:
      - 'fix/**'

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build (No Warning)
        run: dotnet build --no-restore -warnaserror

      - name: Publish
        run: dotnet publish -c Release -r linux-x64 --self-contained false --no-restore -o publish/

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Run Unit Tests
        run: dotnet test Tests/FantasyTown.Auth.UnitTests --no-restore --verbosity minimal

  build:
    name: Build All Platforms
    runs-on: ubuntu-latest
    needs: unit-test
    strategy:
      matrix:
        include:
          - rid: win-x64
            archive: zip
          - rid: win-x86
            archive: zip
          - rid: win-arm64
            archive: zip
          - rid: linux-x64
            archive: tar.gz
          - rid: linux-arm64
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine Configuration
        id: config
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "configuration=Release" >> $GITHUB_OUTPUT
          else
            echo "configuration=Debug" >> $GITHUB_OUTPUT
          fi

      - name: Restore
        run: dotnet restore

      - name: Publish
        run: dotnet publish -c ${{ steps.config.outputs.configuration }} -r ${{ matrix.rid }} --self-contained false --no-restore -o publish/${{ matrix.rid }}/

      - name: Package Archive
        run: |
          cd publish/${{ matrix.rid }}
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip -r ../${{ matrix.rid }}.zip .
          else
            tar -czf ../${{ matrix.rid }}.tar.gz .
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: publish/${{ matrix.rid }}.${{ matrix.archive }}
          retention-days: 7
