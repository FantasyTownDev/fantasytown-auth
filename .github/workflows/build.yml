name: Build

on:
  workflow_run:
    workflows: ["Test (Main/Develop)"]
    types:
      - completed
    branches:
      - main
      - develop

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    strategy:
      matrix:
        rid:
          - win-x64
          - win-x86
          - win-arm64
          - linux-x64
          - linux-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine Configuration
        id: config
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "configuration=Release" >> $GITHUB_OUTPUT
          else
            echo "configuration=Debug" >> $GITHUB_OUTPUT
          fi

      - name: Restore
        run: dotnet restore

      - name: Publish
        run: dotnet publish -c ${{ steps.config.outputs.configuration }} -r ${{ matrix.rid }} --self-contained false --no-restore -o publish/${{ matrix.rid }}/

      - name: Package ZIP
        run: |
          cd publish/${{ matrix.rid }}
          zip -r ../${{ matrix.rid }}.zip .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: publish/${{ matrix.rid }}.zip
          retention-days: 7

  release:
    name: Create Draft Release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_name == 'main' && github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Extract Version
        id: version
        run: |
          VERSION=$(grep -oP '<Version>\K[^<]+' FantasyTown.Auth.csproj)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          draft: true
          generate_release_notes: false
          files: artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
