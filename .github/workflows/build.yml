name: Build

on:
  workflow_run:
    workflows: ["Test (Main/Develop)"]
    types:
      - completed
    branches:
      - main
      - develop

jobs:
  build:
    name: Build ${{ matrix.rid }} (${{ matrix.configuration }})
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    strategy:
      matrix:
        rid:
          - win-x64
          - win-x86
          - win-arm64
          - linux-x64
          - linux-arm64
        configuration:
          - ${{ github.ref_name == 'main' && 'Release' || 'Debug' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Publish
        run: dotnet publish -c ${{ matrix.configuration }} -r ${{ matrix.rid }} --self-contained false --no-restore -o publish/${{ matrix.rid }}/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-${{ matrix.rid }}-${{ matrix.configuration }}
          path: publish/${{ matrix.rid }}/
          retention-days: 7

  release:
    name: Create Draft Release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    steps:
      - uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: main-*

      - name: Extract Version
        id: version
        run: |
          VERSION=$(grep -oP '<Version>\K[^<]+' FantasyTown.Auth.csproj)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          draft: true
          generate_release_notes: false
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
