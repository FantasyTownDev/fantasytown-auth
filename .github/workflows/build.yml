name: Build

on:
  workflow_run:
    workflows: ["Test"]
    types:
      - completed
    branches:
      - main
      - develop

jobs:
  build:
    name: Build (${{ github.ref_name }})
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore
        working-directory: src/FantasyTown.Auth

      - name: Determine Configuration
        id: config
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "configuration=Release" >> $GITHUB_OUTPUT
          else
            echo "configuration=Debug" >> $GITHUB_OUTPUT
          fi

      - name: Build
        run: dotnet publish -c ${{ steps.config.outputs.configuration }} --no-restore -o publish/
        working-directory: src/FantasyTown.Auth

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-build-${{ steps.config.outputs.configuration }}
          path: src/FantasyTown.Auth/publish/
          retention-days: 7

      - name: Extract Version
        if: github.ref_name == 'main'
        id: version
        run: |
          VERSION=$(grep -oP '<Version>\K[^<]+' src/FantasyTown.Auth/FantasyTown.Auth.csproj)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Draft Release
        if: github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          draft: true
          generate_release_notes: false
          files: src/FantasyTown.Auth/publish/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
