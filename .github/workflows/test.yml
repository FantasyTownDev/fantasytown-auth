name: Test

on:
  push:
    branches:
      - main
      - develop

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore
        working-directory: src/FantasyTown.Auth

      - name: Build
        run: dotnet build --no-restore
        working-directory: src/FantasyTown.Auth

      - name: Test
        run: dotnet test --no-build --verbosity normal --logger "trx;LogFileName=results.trx"
        working-directory: tests/FantasyTown.Auth.UnitTests

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/FantasyTown.Auth.UnitTests/TestResults/*.trx
          retention-days: 7
