# .github/workflows/legal-gate.yml
# PR 上自动跑“法律/品牌门禁”。任何一步失败即拒合。
name: legal-gate

on:
  pull_request:
    paths:
      - '**.cs'
      - '**.md'
      - 'LICENSE'
      - 'NOTICE.md'
      - 'TRADEMARK.md'
      - 'COMMERCIAL.md'
      - 'COPYRIGHT'
      - 'GOVERNANCE.md'
      - 'scripts/**'
  push:
    branches: [main]
    paths: ['**.cs', 'LICENSE', 'NOTICE.md']

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: 源文件头部校验
        run: bash scripts/check-headers.sh

      - name: 品牌红线校验（Minecraft / 自伤条款 / ®）
        run: bash scripts/check-brand.sh

      - name: LICENSE 纯净度校验
        run: bash scripts/check-license-purity.sh

      - name: 第三方依赖归档（仅提示，不阻断）
        run: bash scripts/gen-third-party.sh || true

      - name: 版本与 tag 对齐检查（push 时）
        if: github.event_name == 'push'
        run: |
          ver=$(head -1 VERSION | cut -d+ -f1)
          git tag -l | grep -qx "v$ver" || (echo "❌ VERSION=$ver 未打对应 tag v$ver" && exit 1)
